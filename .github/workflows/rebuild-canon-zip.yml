name: Rebuild Canon ZIP

on:
  push:
    paths:
      - ".zip-parts/**"
      - ".github/workflows/rebuild-canon-zip.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and verify ZIP
        shell: bash
        run: |
          cat .zip-parts/part_00.b64 \
              .zip-parts/part_01.b64 \
              .zip-parts/part_02.b64 \
              .zip-parts/part_03.b64 \
              .zip-parts/part_04.b64 \
              .zip-parts/part_05.b64 \
            | tr -d '\n\r ' \
            | base64 -d > GREENBUSINESS_CANON_v1.1.zip

          test "$(stat -c%s GREENBUSINESS_CANON_v1.1.zip)" -eq 25440
          echo "6d3eef1965b171fb061390cc30ff08a3ab02e6a90bf82bf1d00ae48938182de9  GREENBUSINESS_CANON_v1.1.zip" | sha256sum -c -
          unzip -t GREENBUSINESS_CANON_v1.1.zip

      - name: Commit canonical ZIP
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GREENBUSINESS_CANON_v1.1.zip
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: add GreenBusiness canon v1.1 ZIP"
          git push
