name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: greenbusiness
          POSTGRES_USER: greenbusiness
          POSTGRES_PASSWORD: greenbusiness
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U greenbusiness -d greenbusiness"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://greenbusiness:greenbusiness@127.0.0.1:5432/greenbusiness
      JWT_SECRET: ci-only-not-a-production-secret-change-me
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: /tmp/greenbusiness-storage
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: alembic upgrade head
      - run: pytest -q
      - run: python -m pip install pip-audit
      - run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config
      - name: Build and start stack
        run: docker compose up -d --build
      - name: Wait for API and web
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/api/health/ready >/tmp/ready.json &&                curl -fsS http://localhost:8080/api/v1/system/ping >/tmp/ping.json &&                curl -fsS http://localhost:8080 >/tmp/web.html; then
              grep -q "GreenBusiness" /tmp/web.html
              break
            fi
            if [ "$i" -eq 60 ]; then
              docker compose ps
              docker compose logs
              exit 1
            fi
            sleep 2
          done

      - name: Auth bootstrap E2E
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY' > /tmp/register-payload.json
          import json
          print(json.dumps({
              "email": "ci-auth@example.com",
              "password": "CI-strong-password-123",
              "display_name": "CI Owner",
          }))
          PY

          curl -fsS             -c /tmp/cookies.txt             -H "Content-Type: application/json"             --data-binary @/tmp/register-payload.json             http://localhost:8080/api/v1/auth/register             > /tmp/register.json

          ACCESS_TOKEN="$(python -c 'import json; print(json.load(open("/tmp/register.json"))["access_token"])')"

          curl -fsS             -H "Authorization: Bearer $ACCESS_TOKEN"             http://localhost:8080/api/v1/player             > /tmp/player.json

          python - <<'PY'
          import json
          player = json.load(open("/tmp/player.json"))
          assert player["email"] == "ci-auth@example.com"
          assert player["display_name"] == "CI Owner"
          assert player["room_slug"] == "starter-growroom"
          assert len(player["slots"]) == 3
          PY

          cp /tmp/cookies.txt /tmp/old-cookies.txt

          curl -fsS             -b /tmp/cookies.txt             -c /tmp/cookies.txt             -X POST             http://localhost:8080/api/v1/auth/refresh             > /tmp/refresh.json

          OLD_STATUS="$(curl -sS -o /tmp/old-refresh.json -w "%{http_code}"             -b /tmp/old-cookies.txt             -X POST             http://localhost:8080/api/v1/auth/refresh)"
          test "$OLD_STATUS" = "401"

          curl -fsS             -b /tmp/cookies.txt             -c /tmp/cookies.txt             -X POST             http://localhost:8080/api/v1/auth/logout             -o /dev/null

          LOGGED_OUT_STATUS="$(curl -sS -o /tmp/logged-out.json -w "%{http_code}"             -b /tmp/cookies.txt             -X POST             http://localhost:8080/api/v1/auth/refresh)"
          test "$LOGGED_OUT_STATUS" = "401"

      - name: Economic loop E2E
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY' > /tmp/economy-register.json
          import json
          print(json.dumps({
              "email": "ci-economy@example.com",
              "password": "CI-economy-password-123",
              "display_name": "CI Economy",
          }))
          PY

          curl -fsS \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/economy-register.json \
            http://localhost:8080/api/v1/auth/register \
            > /tmp/economy-token.json

          ECON_TOKEN="$(python -c 'import json; print(json.load(open("/tmp/economy-token.json"))["access_token"])')"

          curl -fsS \
            -H "Authorization: Bearer $ECON_TOKEN" \
            http://localhost:8080/api/v1/player \
            > /tmp/economy-player.json

          python - <<'PY'
          import json
          player = json.load(open("/tmp/economy-player.json"))
          assert player["cash"] == 500
          assert player["contract_offers"][0]["key"] == "neighborhood-sampler"
          assert player["upgrade_offers"][0]["key"] == "starter-yield-boost"
          PY

          SLOT_ID="$(python -c 'import json; print(json.load(open("/tmp/economy-player.json"))["slots"][0]["id"])')"

          curl -fsS \
            -H "Authorization: Bearer $ECON_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"variety_key":"aurora-drift"}' \
            http://localhost:8080/api/v1/production/slots/$SLOT_ID/plant \
            > /tmp/economy-plant.json

          docker compose exec -T postgres psql \
            -U greenbusiness -d greenbusiness -v ON_ERROR_STOP=1 \
            -c "UPDATE crop_productions SET ready_at = now() - interval '1 second' WHERE slot_id = '$SLOT_ID'::uuid AND harvested_at IS NULL;"

          curl -fsS \
            -H "Authorization: Bearer $ECON_TOKEN" \
            -X POST \
            http://localhost:8080/api/v1/production/slots/$SLOT_ID/harvest \
            > /tmp/economy-harvest-1.json

          python - <<'PY'
          import json
          harvest = json.load(open("/tmp/economy-harvest-1.json"))
          assert harvest["yield_quantity"] == 3
          PY

          curl -fsS \
            -H "Authorization: Bearer $ECON_TOKEN" \
            -X POST \
            http://localhost:8080/api/v1/economy/contracts/neighborhood-sampler/accept \
            > /tmp/economy-contract.json

          CONTRACT_ID="$(python -c 'import json; print(json.load(open("/tmp/economy-contract.json"))["id"])')"

          curl -fsS \
            -H "Authorization: Bearer $ECON_TOKEN" \
            -H "Idempotency-Key: ci-contract-complete-1" \
            -X POST \
            http://localhost:8080/api/v1/economy/contracts/$CONTRACT_ID/complete \
            > /tmp/economy-complete.json

          python - <<'PY'
          import json
          result = json.load(open("/tmp/economy-complete.json"))
          assert result["cash"] == 650
          PY

          curl -fsS \
            -H "Authorization: Bearer $ECON_TOKEN" \
            -H "Idempotency-Key: ci-contract-complete-1" \
            -X POST \
            http://localhost:8080/api/v1/economy/contracts/$CONTRACT_ID/complete \
            > /tmp/economy-complete-replay.json

          python - <<'PY'
          import json
          result = json.load(open("/tmp/economy-complete-replay.json"))
          assert result["cash"] == 650
          PY

          curl -fsS \
            -H "Authorization: Bearer $ECON_TOKEN" \
            -H "Idempotency-Key: ci-upgrade-purchase-1" \
            -X POST \
            http://localhost:8080/api/v1/economy/upgrades/starter-yield-boost/purchase \
            > /tmp/economy-upgrade.json

          python - <<'PY'
          import json
          result = json.load(open("/tmp/economy-upgrade.json"))
          assert result["cash"] == 50
          assert result["owned_upgrade_keys"] == ["starter-yield-boost"]
          PY

          curl -fsS \
            -H "Authorization: Bearer $ECON_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"variety_key":"aurora-drift"}' \
            http://localhost:8080/api/v1/production/slots/$SLOT_ID/plant \
            > /tmp/economy-plant-2.json

          docker compose exec -T postgres psql \
            -U greenbusiness -d greenbusiness -v ON_ERROR_STOP=1 \
            -c "UPDATE crop_productions SET ready_at = now() - interval '1 second' WHERE slot_id = '$SLOT_ID'::uuid AND harvested_at IS NULL;"

          curl -fsS \
            -H "Authorization: Bearer $ECON_TOKEN" \
            -X POST \
            http://localhost:8080/api/v1/production/slots/$SLOT_ID/harvest \
            > /tmp/economy-harvest-2.json

          python - <<'PY'
          import json
          harvest = json.load(open("/tmp/economy-harvest-2.json"))
          assert harvest["yield_quantity"] == 4
          PY

      - name: Teardown
        if: always()
        run: docker compose down -v
