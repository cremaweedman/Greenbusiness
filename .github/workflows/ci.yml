name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: greenbusiness
          POSTGRES_USER: greenbusiness
          POSTGRES_PASSWORD: greenbusiness
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U greenbusiness -d greenbusiness"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://greenbusiness:greenbusiness@127.0.0.1:5432/greenbusiness
      JWT_SECRET: ci-only-not-a-production-secret-change-me
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: /tmp/greenbusiness-storage
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: alembic upgrade head
      - run: pytest -q
      - run: python -m pip install pip-audit
      - run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config
      - name: Build and start stack
        run: docker compose up -d --build
      - name: Wait for API and web
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/api/health/ready >/tmp/ready.json &&                curl -fsS http://localhost:8080/api/v1/system/ping >/tmp/ping.json &&                curl -fsS http://localhost:8080 >/tmp/web.html; then
              grep -q "GreenBusiness" /tmp/web.html
              break
            fi
            if [ "$i" -eq 60 ]; then
              docker compose ps
              docker compose logs
              exit 1
            fi
            sleep 2
          done

      - name: Auth bootstrap E2E
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY' > /tmp/register-payload.json
          import json
          print(json.dumps({
              "email": "ci-auth@example.com",
              "password": "CI-strong-password-123",
              "display_name": "CI Owner",
          }))
          PY

          curl -fsS             -c /tmp/cookies.txt             -H "Content-Type: application/json"             --data-binary @/tmp/register-payload.json             http://localhost:8080/api/v1/auth/register             > /tmp/register.json

          ACCESS_TOKEN="$(python -c 'import json; print(json.load(open("/tmp/register.json"))["access_token"])')"

          curl -fsS             -H "Authorization: Bearer $ACCESS_TOKEN"             http://localhost:8080/api/v1/player             > /tmp/player.json

          python - <<'PY'
          import json
          player = json.load(open("/tmp/player.json"))
          assert player["email"] == "ci-auth@example.com"
          assert player["display_name"] == "CI Owner"
          assert player["room_slug"] == "starter-growroom"
          assert len(player["slots"]) == 3
          PY

          cp /tmp/cookies.txt /tmp/old-cookies.txt

          curl -fsS             -b /tmp/cookies.txt             -c /tmp/cookies.txt             -X POST             http://localhost:8080/api/v1/auth/refresh             > /tmp/refresh.json

          OLD_STATUS="$(curl -sS -o /tmp/old-refresh.json -w "%{http_code}"             -b /tmp/old-cookies.txt             -X POST             http://localhost:8080/api/v1/auth/refresh)"
          test "$OLD_STATUS" = "401"

          curl -fsS             -b /tmp/cookies.txt             -c /tmp/cookies.txt             -X POST             http://localhost:8080/api/v1/auth/logout             -o /dev/null

          LOGGED_OUT_STATUS="$(curl -sS -o /tmp/logged-out.json -w "%{http_code}"             -b /tmp/cookies.txt             -X POST             http://localhost:8080/api/v1/auth/refresh)"
          test "$LOGGED_OUT_STATUS" = "401"

      - name: Economic loop E2E
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY' > /tmp/economy-register.json
          import json
          print(json.dumps({
              "email": "ci-economy@example.com",
              "password": "CI-economy-password-123",
              "display_name": "CI Economy",
          }))
          PY

          curl -fsS \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/economy-register.json \
            http://localhost:8080/api/v1/auth/register \
            > /tmp/economy-token.json

          ECON_TOKEN="$(python -c 'import json; print(json.load(open("/tmp/economy-token.json"))["access_token"])')"

          curl -fsS \
            -H "Authorization: Bearer $ECON_TOKEN" \
            http://localhost:8080/api/v1/player \
            > /tmp/economy-player.json

          python - <<'PY'
          import json
          player = json.load(open("/tmp/economy-player.json"))
          assert player["cash"] == 500
          assert player["contract_offers"][0]["key"] == "neighborhood-sampler"
          assert player["upgrade_offers"][0]["key"] == "starter-yield-boost"
          PY

          SLOT_ID="$(python -c 'import json; print(json.load(open("/tmp/economy-player.json"))["slots"][0]["id"])')"

          curl -fsS \
            -H "Authorization: Bearer $ECON_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"variety_key":"aurora-drift"}' \
            http://localhost:8080/api/v1/production/slots/$SLOT_ID/plant \
            > /tmp/economy-plant.json

          docker compose exec -T postgres psql \
            -U greenbusiness -d greenbusiness -v ON_ERROR_STOP=1 \
            -c "UPDATE crop_productions SET ready_at = now() - interval '1 second' WHERE slot_id = '$SLOT_ID'::uuid AND harvested_at IS NULL;"

          curl -fsS \
            -H "Authorization: Bearer $ECON_TOKEN" \
            -X POST \
            http://localhost:8080/api/v1/production/slots/$SLOT_ID/harvest \
            > /tmp/economy-harvest-1.json

          python - <<'PY'
          import json
          harvest = json.load(open("/tmp/economy-harvest-1.json"))
          assert harvest["yield_quantity"] == 3
          PY

          curl -fsS \
            -H "Authorization: Bearer $ECON_TOKEN" \
            -X POST \
            http://localhost:8080/api/v1/economy/contracts/neighborhood-sampler/accept \
            > /tmp/economy-contract.json

          CONTRACT_ID="$(python -c 'import json; print(json.load(open("/tmp/economy-contract.json"))["id"])')"

          curl -fsS \
            -H "Authorization: Bearer $ECON_TOKEN" \
            -H "Idempotency-Key: ci-contract-complete-1" \
            -X POST \
            http://localhost:8080/api/v1/economy/contracts/$CONTRACT_ID/complete \
            > /tmp/economy-complete.json

          python - <<'PY'
          import json
          result = json.load(open("/tmp/economy-complete.json"))
          assert result["cash"] == 650
          PY

          curl -fsS \
            -H "Authorization: Bearer $ECON_TOKEN" \
            -H "Idempotency-Key: ci-contract-complete-1" \
            -X POST \
            http://localhost:8080/api/v1/economy/contracts/$CONTRACT_ID/complete \
            > /tmp/economy-complete-replay.json

          python - <<'PY'
          import json
          result = json.load(open("/tmp/economy-complete-replay.json"))
          assert result["cash"] == 650
          PY

          curl -fsS \
            -H "Authorization: Bearer $ECON_TOKEN" \
            -H "Idempotency-Key: ci-upgrade-purchase-1" \
            -X POST \
            http://localhost:8080/api/v1/economy/upgrades/starter-yield-boost/purchase \
            > /tmp/economy-upgrade.json

          python - <<'PY'
          import json
          result = json.load(open("/tmp/economy-upgrade.json"))
          assert result["cash"] == 50
          assert result["owned_upgrade_keys"] == ["starter-yield-boost"]
          PY

          curl -fsS \
            -H "Authorization: Bearer $ECON_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"variety_key":"aurora-drift"}' \
            http://localhost:8080/api/v1/production/slots/$SLOT_ID/plant \
            > /tmp/economy-plant-2.json

          docker compose exec -T postgres psql \
            -U greenbusiness -d greenbusiness -v ON_ERROR_STOP=1 \
            -c "UPDATE crop_productions SET ready_at = now() - interval '1 second' WHERE slot_id = '$SLOT_ID'::uuid AND harvested_at IS NULL;"

          curl -fsS \
            -H "Authorization: Bearer $ECON_TOKEN" \
            -X POST \
            http://localhost:8080/api/v1/production/slots/$SLOT_ID/harvest \
            > /tmp/economy-harvest-2.json

          python - <<'PY'
          import json
          harvest = json.load(open("/tmp/economy-harvest-2.json"))
          assert harvest["yield_quantity"] == 4
          PY

      - name: Contracts progression E2E
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY' > /tmp/p3m2-register.json
          import json
          print(json.dumps({
              "email": "ci-progression@example.com",
              "password": "CI-progression-password-123",
              "display_name": "CI Progression",
          }))
          PY

          curl -fsS \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/p3m2-register.json \
            http://localhost:8080/api/v1/auth/register \
            > /tmp/p3m2-token.json

          P3M2_TOKEN="$(python -c 'import json; print(json.load(open("/tmp/p3m2-token.json"))["access_token"])')"

          curl -fsS \
            -H "Authorization: Bearer $P3M2_TOKEN" \
            http://localhost:8080/api/v1/player \
            > /tmp/p3m2-player.json

          python - <<'PY'
          import json
          player = json.load(open("/tmp/p3m2-player.json"))
          offers = player["contract_offers"]
          assert len(offers) == 4
          assert sum(not offer["specialized"] for offer in offers) == 3
          assert sum(offer["specialized"] for offer in offers) == 1
          assert player["next_level_xp"] == 100
          assert player["skill_points_unspent"] == 0
          assert {item["branch"] for item in player["skill_branches"]} == {
              "botany", "commerce", "operations"
          }
          assert "contracts-standard" in player["unlocked_keys"]
          assert player["contract_refresh_at"] > player["server_time"]
          PY

          docker compose exec -T postgres psql \
            -U greenbusiness -d greenbusiness -v ON_ERROR_STOP=1 \
            -c "UPDATE progression SET level = 5, reputation = 100 WHERE user_id = (SELECT id FROM users WHERE email = 'ci-progression@example.com');"

          curl -fsS \
            -H "Authorization: Bearer $P3M2_TOKEN" \
            http://localhost:8080/api/v1/player \
            > /tmp/p3m2-unlocked.json

          python - <<'PY' > /tmp/p3m2-offer-ids.txt
          import json
          player = json.load(open("/tmp/p3m2-unlocked.json"))
          offers = player["contract_offers"]
          assert len(offers) == 4
          assert all(not offer["locked"] for offer in offers)
          for offer in offers:
              print(offer["offer_id"])
          PY

          mapfile -t OFFER_IDS < /tmp/p3m2-offer-ids.txt

          for index in 0 1 2; do
            curl -fsS \
              -H "Authorization: Bearer $P3M2_TOKEN" \
              -X POST \
              "http://localhost:8080/api/v1/economy/offers/${OFFER_IDS[$index]}/accept" \
              > "/tmp/p3m2-accept-$index.json"
          done

          FOURTH_STATUS="$(curl -sS -o /tmp/p3m2-fourth.json -w "%{http_code}" \
            -H "Authorization: Bearer $P3M2_TOKEN" \
            -X POST \
            "http://localhost:8080/api/v1/economy/offers/${OFFER_IDS[3]}/accept")"
          test "$FOURTH_STATUS" = "409"

          curl -fsS \
            -H "Authorization: Bearer $P3M2_TOKEN" \
            http://localhost:8080/api/v1/player \
            > /tmp/p3m2-final.json

          python - <<'PY'
          import json
          player = json.load(open("/tmp/p3m2-final.json"))
          assert len(player["active_contracts"]) == 3
          assert player["level"] == 5
          assert player["reputation"] == 100
          assert "specialized-contracts" in player["unlocked_keys"]
          PY

      - name: Missions mastery E2E
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY' > /tmp/p4-register.json
          import json
          print(json.dumps({
              "email": "ci-missions@example.com",
              "password": "CI-missions-password-123",
              "display_name": "CI Missions",
          }))
          PY

          curl -fsS \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/p4-register.json \
            http://localhost:8080/api/v1/auth/register \
            > /tmp/p4-token.json

          P4_TOKEN="$(python -c 'import json; print(json.load(open("/tmp/p4-token.json"))["access_token"])')"

          curl -fsS \
            -H "Authorization: Bearer $P4_TOKEN" \
            http://localhost:8080/api/v1/player \
            > /tmp/p4-player-initial.json

          python - <<'PY'
          import json
          player = json.load(open("/tmp/p4-player-initial.json"))
          assert len(player["missions"]) == 10
          assert player["missions"][0]["status"] == "active"
          assert player["missions"][1]["status"] == "locked"
          assert len(player["contacts"]) == 2
          assert len(player["daily_mission_keys"]) == 2
          assert len(player["weekly_mission_keys"]) == 3
          PY

          P4_SLOT_ID="$(python -c 'import json; print(json.load(open("/tmp/p4-player-initial.json"))["slots"][0]["id"])')"

          curl -fsS \
            -H "Authorization: Bearer $P4_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"variety_key":"aurora-drift"}' \
            http://localhost:8080/api/v1/production/slots/$P4_SLOT_ID/plant \
            > /tmp/p4-plant.json

          curl -fsS \
            -H "Authorization: Bearer $P4_TOKEN" \
            -X POST \
            http://localhost:8080/api/v1/production/slots/$P4_SLOT_ID/care \
            > /tmp/p4-care.json

          docker compose exec -T postgres psql \
            -U greenbusiness -d greenbusiness -v ON_ERROR_STOP=1 \
            -c "UPDATE crop_productions SET ready_at = now() - interval '1 second' WHERE slot_id = '$P4_SLOT_ID'::uuid AND harvested_at IS NULL;"

          curl -fsS \
            -H "Authorization: Bearer $P4_TOKEN" \
            -X POST \
            http://localhost:8080/api/v1/production/slots/$P4_SLOT_ID/harvest \
            > /tmp/p4-harvest.json

          curl -fsS \
            -H "Authorization: Bearer $P4_TOKEN" \
            http://localhost:8080/api/v1/player \
            > /tmp/p4-player-final.json

          python - <<'PY'
          import json
          player = json.load(open("/tmp/p4-player-final.json"))
          missions = player["missions"]
          assert [mission["status"] for mission in missions[:3]] == [
              "completed", "completed", "completed"
          ]
          assert missions[3]["status"] == "active"
          assert player["cash"] == 550
          assert player["xp"] == 60
          mastery = next(item for item in player["mastery"] if item["variety_key"] == "aurora-drift")
          assert mastery["harvest_quantity"] == 4
          assert mastery["contract_quantity"] == 0
          assert mastery["points"] == 4
          PY

          REPLAY_STATUS="$(curl -sS -o /tmp/p4-replay.json -w "%{http_code}" \
            -H "Authorization: Bearer $P4_TOKEN" \
            -X POST \
            http://localhost:8080/api/v1/production/slots/$P4_SLOT_ID/harvest)"
          test "$REPLAY_STATUS" = "409"

          curl -fsS \
            -H "Authorization: Bearer $P4_TOKEN" \
            http://localhost:8080/api/v1/player \
            > /tmp/p4-after-replay.json

          python - <<'PY'
          import json
          player = json.load(open("/tmp/p4-after-replay.json"))
          assert player["cash"] == 550
          mastery = next(item for item in player["mastery"] if item["variety_key"] == "aurora-drift")
          assert mastery["points"] == 4
          PY

      - name: Teardown
        if: always()
        run: docker compose down -v
