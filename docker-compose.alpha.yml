services:
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports: []

  redis:
    restart: unless-stopped
    ports: []

  api:
    restart: unless-stopped
    environment:
      APP_ENV: alpha
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-greenbusiness}
      COOKIE_SECURE: "true"
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY is required}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET is required}
      ADMIN_ACTOR_ID: ${ADMIN_ACTOR_ID:?ADMIN_ACTOR_ID is required}
      ADMIN_ROLE: ${ADMIN_ROLE:-superadmin}
      CREATOR_ACCESS_ENABLED: "false"
      SANDBOX_MONETIZATION_ENABLED: "false"
      SANDBOX_REWARDED_ADS_ENABLED: "false"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_BACKEND: redis
      PUSH_TOKEN_ENCRYPTION_KEY: ${PUSH_TOKEN_ENCRYPTION_KEY:?PUSH_TOKEN_ENCRYPTION_KEY is required}
      ANALYTICS_REQUEST_SAMPLE_RATE: ${ANALYTICS_REQUEST_SAMPLE_RATE:-1.0}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH:-/data/greenbusiness}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}

  web:
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_URL: /api

  nginx:
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ALPHA_HTTP_PORT:-8080}:80"
